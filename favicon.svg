<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rod of Asclepius: one baby snake wound around a staff, with the site's red pixel heart -->
  <defs>
    <path id="snake" d="M22 57 C22 48 42 49 42 40 C42 31 22 33 22 24 C22 17 33 15 37 14"/>
    <!-- where the snake passes in front of the staff (centered on the crossings at y 48.5 and 15.3) -->
    <clipPath id="front"><rect x="28.5" y="44.5" width="7" height="8"/><rect x="28.5" y="11.6" width="7" height="7.6"/></clipPath>
    <!-- slightly wider for the light body, so no clip edge lands on it -->
    <clipPath id="frontWide"><rect x="26" y="43" width="12" height="11"/><rect x="26" y="10.5" width="12" height="9.5"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#141413"/>
  <path transform="translate(9 8) scale(1.6)" fill="#E5484D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"/>
  <!-- whole snake, behind the staff -->
  <use href="#snake" fill="none" stroke="#141413" stroke-width="9" stroke-linecap="round"/>
  <use href="#snake" fill="none" stroke="#FAF9F6" stroke-width="6" stroke-linecap="round"/>
  <!-- staff and knob -->
  <rect x="30" y="9" width="4" height="49" rx="2" fill="#FAF9F6" stroke="#141413" stroke-width="2"/>
  <circle cx="32" cy="8" r="3.2" fill="#FAF9F6" stroke="#141413" stroke-width="1.5"/>
  <!-- the stretches in front of the staff -->
  <use href="#snake" clip-path="url(#front)" fill="none" stroke="#141413" stroke-width="9"/>
  <use href="#snake" clip-path="url(#frontWide)" fill="none" stroke="#FAF9F6" stroke-width="6"/>
  <!-- baby head, facing right -->
  <ellipse cx="42.5" cy="12.5" rx="6.6" ry="5.6" fill="#FAF9F6" stroke="#141413" stroke-width="1.5"/>
  <circle cx="44.6" cy="11.4" r="1.9" fill="#141413"/>
  <circle cx="45.2" cy="10.7" r=".6" fill="#FAF9F6"/>
  <path d="M43.8 15.4 Q45.4 16.4 47 15" fill="none" stroke="#141413" stroke-width=".9" stroke-linecap="round"/>
</svg>
